[project]
name = "bfm-swm-repro"
version = "0.1.0"
description = "Reproduction of Budget-Feasible Mechanisms for Submodular Welfare Maximization (arXiv 2605.00411, OpenReview hqFugMmCqJ)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.1,<3",
    "scipy>=1.14,<2",
    "networkx>=3.3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.uv]
package = false
